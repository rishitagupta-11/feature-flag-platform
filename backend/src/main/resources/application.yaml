spring:
  application:
    name: feature-flag-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/feature_flag_db
    username: featureflag
    password: local_dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080